# Test local al imaginii JupyterHub (single-user), fără hub:
#
#   docker compose up --build        # JupyterLab pe http://localhost:8888, Pluto din Launcher
#   docker compose down -v           # șterge și volumul home (simulează un student nou)
services:
  curs:
    build: .
    image: curs-ecologie2026
    init: true
    ports:
      - "127.0.0.1:8888:8888"
    # Fără token: portul e legat doar de localhost.
    command: ["start-notebook.py", "--IdentityProvider.token="]
    volumes:
      # Volum persistent pentru home, ca în JupyterHub; materialele sînt aduse din GitHub în ~/course.
      - home:/home/jovyan

volumes:
  home:
